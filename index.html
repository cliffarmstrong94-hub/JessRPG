body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);padding-bottom:160px;overflow-x:hidden}

.hdr-title{font-size:11px;color:var(--rose);text-transform:uppercase;margin-top:3px;letter-spacing:1px}
.hdr-xp{font-size:10px;color:var(--dim);margin-top:2px}
.save-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-left:6px;vertical-align:middle;transition:background .3s}

.ticker::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;font-size:10px;background:rgba(192,132,160,0.1);padding:4px 10px;border-radius:20px;border:1px solid rgba(192,132,160,0.25);color:#d4a8c0;white-space:nowrap}

.water-xp{font-size:9px;color:var(--blue);width:42px;text-align:right;flex-shrink:0}

function localDateStr(d){
  const dt=d||new Date();
  const yr=dt.getFullYear();
  const mo=String(dt.getMonth()+1).padStart(2,"0");
  const dy=String(dt.getDate()).padStart(2,"0");
  return `${yr}-${mo}-${dy}`;
}
function todayStr(){ return localDateStr(new Date()); }
function prevDayStr(dk){
  const d=new Date(dk+"T12:00:00");
  d.setDate(d.getDate()-1);
  return localDateStr(d);
}
function weekStartStr(dk){
  const d=new Date(dk+"T12:00:00");
  d.setDate(d.getDate()-d.getDay());
  return localDateStr(d);
}
function last7Days(){
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    days.push(localDateStr(d));
  }
  return days;
}

function sleepXP(hrs,wakeups){
  let xp=0;
  if(hrs>=8)        xp=40;
  else if(hrs>=7.5) xp=30;
  else if(hrs>=7)   xp=25;
  else if(hrs>=6.5) xp=20;
  else if(hrs>=6)   xp=15;
  else if(hrs>=5)   xp=10;
  else              xp=5;
  const pen=Math.max(0,(wakeups-1))*3;
  return Math.max(0,xp-pen);
}
function sleepColor(hrs){
  if(hrs>=7.5) return "#22c55e";
  if(hrs>=6.5) return "#a78bda";
  if(hrs>=5.5) return "#f59e0b";
  return "#f87171";
}
function parseTimeToMins(str){
  str=str.trim().toLowerCase();
  const m12=str.match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)$/);
  if(m12){
    let h=parseInt(m12[1]);
    const mn=m12[2]?parseInt(m12[2]):0;
    const ap=m12[3];
    if(ap==="pm"&&h!==12) h+=12;
    if(ap==="am"&&h===12) h=0;
    return h*60+mn;
  }
  const m24=str.match(/^(\d{1,2}):(\d{2})$/);
  if(m24) return parseInt(m24[1])*60+parseInt(m24[2]);
  return null;
}
function calcSleepHours(bedStr,wakeStr){
  const bed=parseTimeToMins(bedStr);
  const wake=parseTimeToMins(wakeStr);
  if(bed===null||wake===null) return null;
  let diff=wake-bed;
  if(diff<=0) diff+=1440;
  return Math.round((diff/60)*10)/10;
}

function initState(){
  return {
    xp:{mother:0,career:0,hearth:0,wellness:0,partner:0},
    done:{},bottles:{},grace:{},sleep:{},
    partner:{name:"Cliff",xp:0,lv:1},
    lastReset:"",recapShown:{},
  };
}
let S=initState();
try{const r=localStorage.getItem(DB_KEY);if(r)S={...initState(),...JSON.parse(r)};}catch{}

let activeTab="mother";
let viewDate=new Date();

function save(){
  localStorage.setItem(DB_KEY,JSON.stringify(S));
  const dot=document.getElementById("save-dot");
  if(dot){dot.style.background="var(--gold)";setTimeout(()=>{dot.style.background="var(--green)";},600);}
}
function toast(msg){
  const el=document.getElementById("toast");
  el.innerText=msg;el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),2200);
}

function autoReset(){
  const today=todayStr();
  if(S.lastReset===today) return;
  const newDone={};
  Object.keys(S.done||{}).forEach(k=>{
    if(k.substring(0,10)===today) newDone[k]=S.done[k];
  });
  S.done=newDone;
  const newBottles={};
  if((S.bottles||{})[today]) newBottles[today]=S.bottles[today];
  S.bottles=newBottles;
  S.lastReset=today;
  save();
}

function checkWeeklyRecap(){
  const now=new Date();
  if(now.getDay()!==0) return;
  if(now.getHours()<7) return;
  const wk=weekStartStr(todayStr());
  if((S.recapShown||{})[wk]) return;
  const days=last7Days();
  let totalSleep=0,sleepDays=0,waterDays=0;
  const catCounts={mother:0,career:0,hearth:0,wellness:0,partner:0};
  days.forEach(dk=>{
    const sl=(S.sleep||{})[dk];
    if(sl&&sl.hrs){totalSleep+=sl.hrs;sleepDays++;}
    if(((S.bottles||{})[dk]||0)>=4) waterDays++;
    Object.keys(QUEST_DEFS).forEach(cat=>{
      QUEST_DEFS[cat].forEach(q=>{
        if(!q.penalty&&(S.done||{})[dk+"_"+q.id]) catCounts[cat]=(catCounts[cat]||0)+1;
      });
    });
  });
  const avgSleep=sleepDays>0?(totalSleep/sleepDays).toFixed(1):null;
  const txp=Object.values(S.xp).reduce((a,b)=>a+b,0);
  const wrap=document.getElementById("modal-wrap");
  wrap.innerHTML=`
  <div class="modal-overlay">
    <div class="modal">
      <div class="modal-title">&#x1F338; Weekly Recap</div>
      <div class="modal-sub">Here is how your week looked, Jessica.</div>
      ${avgSleep?`<div class="modal-stat"><span>Avg Sleep</span><span class="modal-stat-val">${avgSleep} hrs/night</span></div>`:""}
      <div class="modal-stat"><span>Water Goal Days</span><span class="modal-stat-val">${waterDays}/7 days</span></div>
      <div class="modal-stat"><span>Mother Quests</span><span class="modal-stat-val">${catCounts.mother} completed</span></div>
      <div class="modal-stat"><span>Career Quests</span><span class="modal-stat-val">${catCounts.career} completed</span></div>
      <div class="modal-stat"><span>Hearth Quests</span><span class="modal-stat-val">${catCounts.hearth} completed</span></div>
      <div class="modal-stat"><span>Wellness Quests</span><span class="modal-stat-val">${catCounts.wellness} completed</span></div>
      <div class="modal-stat"><span>Total XP</span><span class="modal-stat-val">${txp.toLocaleString()} XP</span></div>
      <button class="modal-btn" onclick="closeRecap('${wk}')">Keep Going &#x1F338;</button>
    </div>
  </div>`;
}
function closeRecap(wk){
  if(!S.recapShown) S.recapShown={};
  S.recapShown[wk]=true;
  save();
  document.getElementById("modal-wrap").innerHTML="";
}

function resolveQuest(q){
  if(!q.vars||q.vars.length===0) return {t:q.t,xp:q.xp,varied:false};
  const yd=prevDayStr(todayStr());
  for(const v of q.vars){
    if((S.done||{})[yd+"_"+v.trigger]) return {t:v.t,xp:v.xp,varied:true};
  }
  return {t:q.t,xp:q.xp,varied:false};
}

function isGrace(d){
  const dk=d instanceof Date?localDateStr(d):d;
  return !!(S.grace&&S.grace[dk]);
}
function toggleGrace(){
  const dk=localDateStr(viewDate);
  const wk=weekStartStr(dk);
  if(S.grace&&S.grace[dk]){delete S.grace[dk];save();renderAll();return;}
  const used=Object.entries(S.grace||{}).filter(([k,v])=>v&&weekStartStr(k)===wk).length;
  if(used>=1){toast("Only 1 grace day per week.");return;}
  if(!S.grace) S.grace={};
  S.grace[dk]=true;save();renderAll();
  toast("Grace Day active \u2014 no penalties today.");
}

function toggleBottle(i){
  const dk=localDateStr(viewDate);
  if(!S.bottles) S.bottles={};
  const cur=S.bottles[dk]||0;
  const next=cur===i+1?i:i+1;
  S.bottles[dk]=next;
  if(next===4) toast("Hydration goal reached! +15 XP");
  save();renderTrackers();
}

function logSleep(){
  const bed=document.getElementById("sleep-bed")?document.getElementById("sleep-bed").value:"";
  const wake=document.getElementById("sleep-wake")?document.getElementById("sleep-wake").value:"";
  const wkups=document.getElementById("sleep-wakeups")?parseInt(document.getElementById("sleep-wakeups").value)||0:0;
  if(!bed||!wake){toast("Enter bed time and wake time.");return;}
  const hrs=calcSleepHours(bed,wake);
  if(hrs===null||hrs>14||hrs<1){toast("Try formats like 10:30pm and 7:00am");return;}
  const dk=localDateStr(viewDate);
  const xp=sleepXP(hrs,wkups);
  const old=(S.sleep||{})[dk];
  if(old) S.xp.wellness=Math.max(0,(S.xp.wellness||0)-old.xp);
  if(!S.sleep) S.sleep={};
  S.sleep[dk]={hrs,wakeups:wkups,xp,bed,wake};
  S.xp.wellness=(S.xp.wellness||0)+xp;
  save();renderAll();
  toast("+"+xp+" XP \u2014 "+hrs+"h sleep logged");
}
function clearSleep(dk){
  const sl=(S.sleep||{})[dk];
  if(sl) S.xp.wellness=Math.max(0,(S.xp.wellness||0)-sl.xp);
  delete S.sleep[dk];
  save();renderAll();
}

function toggleQuest(id,xp,cat,isPenalty){
  const vCat=cat||activeTab;
  const vkDk=localDateStr(viewDate);
  if(isPenalty&&isGrace(vkDk)){toast("Grace Day \u2014 penalty waived!");return;}
  const k=vkDk+"_"+id;
  if(!S.done) S.done={};
  if(S.done[k]){
    delete S.done[k];
    S.xp[vCat]=Math.max(0,(S.xp[vCat]||0)-xp);
  } else {
    S.done[k]=true;
    S.xp[vCat]=(S.xp[vCat]||0)+xp;
    if(xp>0) toast("+"+xp+" XP");
    else toast(xp+" XP \u2014 log it, receive grace.");
  }
  save();renderAll();
}

function genCode(){
  const txp=Object.values(S.xp).reduce((a,b)=>a+b,0);
  const code=btoa(JSON.stringify({n:"Jessica",x:txp,l:getLevel(txp)}));
  document.getElementById("sync-out").value=code;
  if(navigator.clipboard) navigator.clipboard.writeText(code);
  toast("Code copied to clipboard!");
}
function importCode(){
  try{
    const d=JSON.parse(atob(document.getElementById("sync-in").value.trim()));
    S.partner={name:d.n,xp:d.x,lv:d.l};
    save();renderAll();toast("Synced with "+d.n+"!");
  }catch{toast("Invalid code.");}
}

function getLevel(xp){return Math.min(Math.floor((xp||0)/150)+1,7);}
function getTitle(arr,lv){return arr[Math.min(lv-1,arr.length-1)];}
function getWeeks(){return Math.floor((new Date()-LMP)/(7*24*60*60*1000));}
function getDaysLeft(){return Math.max(0,Math.ceil((DUE-new Date())/(24*60*60*1000)));}
function questVisible(q){
  if(q.daily) return true;
  if(q.dm&&q.dm.length>0) return q.dm.includes(viewDate.getDay());
  return true;
}
function questLocked(q){
  if(!q.minLv) return false;
  return getLevel(S.xp[activeTab]||0)<q.minLv;
}

function renderGrace(){

  const used=Object.entries(S.grace||{}).filter(([k,v])=>v&&weekStartStr(k)===wk).length;
  const el=document.getElementById("grace-toggle");
  if(grace){
    el.innerHTML=`<div class="grace-active">Active</div>`;
  } else {
    const can=used<1;
    el.innerHTML=`<button class="grace-btn" onclick="toggleGrace()" ${can?'':'disabled style="opacity:.3"'}>${can?"Use Grace Day":"Used this week"}</button>`;
  }
}

function renderDays(){
  const todayK=todayStr();
  let html="";

    const d=new Date();d.setDate(new Date().getDate()+i);

    html+=`<div class="day-btn ${dk===localDateStr(viewDate)?'active':''}" onclick="setDay(${i})">${DAYS_SHORT[d.getDay()]}${dk===todayK?" &#9733;":""}</div>`;
  }
  document.getElementById("day-row").innerHTML=html;
}

function setTab(t){
  activeTab=t;
  document.querySelectorAll(".tab").forEach(el=>el.classList.remove("active"));
  document.getElementById("tab-"+t)?.classList.add("active");
  renderAll();
}

function renderQuestRow(q,dk,isFaith){
  const res=resolveQuest(q);
  const done=!!((S.done||{})[dk+"_"+q.id]);
  const col=q.penalty?"var(--red)":isFaith?"var(--lavender)":q.synergy?"var(--lavender)":"var(--text)";
  const cls=[
    done?"done":"",
    q.penalty?"penalty":"",
    isFaith&&!q.penalty?"faith-q":"",
    q.synergy?"synergy":"",
    res.varied&&!q.penalty?"varied":""
  ].filter(Boolean).join(" ");
  const vb=res.varied&&!q.penalty?`<span class="varied-badge">&#x1F504; Evolved</span>`:"";
  const ob=q.office?`<span class="office-badge">Office</span>`:"";
  const wb=q.wfh?`<span class="wfh-badge">WFH</span>`:"";
  const dt=(!q.daily&&q.dm)?`<div class="quest-sub">${DAYS_FULL[viewDate.getDay()]} only</div>`:"";
  const cat=activeTab;
  return `<div class="quest ${cls}" onclick="toggleQuest('${q.id}',${res.xp},'${cat}',${!!q.penalty})">
    <div><div class="quest-text">${res.t}${vb}${ob}${wb}</div>${dt}</div>
    <div class="quest-xp" style="color:${col}">${res.xp>0?"+":""}${res.xp}</div>
  </div>`;
}

function renderApp(){
  const dk=localDateStr(viewDate);
  const catXp=S.xp[activeTab]||0;
  const catLv=getLevel(catXp);
  const catPct=((catXp%150)/150*100).toFixed(1);
  const titles=CAT_TITLES[activeTab];
  const grace=isGrace(dk);
  const dow=viewDate.getDay();
  let html="";

  if(activeTab==="rewards"){
    const txp=Object.values(S.xp).reduce((a,b)=>a+b,0);
    html+=`<div class="card"><div class="card-title">Legacy Goal</div>
      <div class="reward-item" style="border-color:rgba(192,132,160,.5)">
        <div class="reward-header"><span>Family Vacation</span><span>${txp}/1000 XP</span></div>
        <div class="bar"><div class="fill" style="width:${Math.min(txp/10,100)}%"></div></div>
        <div style="font-size:10px;color:var(--dim)">Earn 1000 total XP to unlock a family trip</div>
      </div></div>`;
    REWARDS.forEach(r=>{
      const cur=S.xp[r.cat]||0;
      const count=Math.floor(cur/r.step);
      const prog=((cur%r.step)/r.step*100).toFixed(1);
      html+=`<div class="card"><div class="card-title">${r.cat.toUpperCase()} Reward</div>
        <div class="reward-item">
          <div class="reward-header"><span>${r.reward}</span><span>Earned: ${count}x</span></div>
          <div class="bar"><div class="fill" style="width:${prog}%"></div></div>
          <div style="font-size:10px;color:var(--dim)">${cur%r.step} / ${r.step} XP toward next</div>
        </div></div>`;
    });
    document.getElementById("app").innerHTML=html;return;
  }

  if(activeTab==="coop"){
    const myXp=Object.values(S.xp).reduce((a,b)=>a+b,0);
    const myLv=getLevel(myXp);
    const pXp=S.partner?.xp||0;
    const pLv=S.partner?.lv||1;
    const iWin=myXp>=pXp;
    html=`<div class="card"><div class="card-title">Armstrong Co-Op Leaderboard</div>
      <div class="coop-row">
        <div class="coop-player ${iWin?'coop-lead':''}">
          <div class="coop-name">Jessica</div>
          <div class="coop-xp">${myXp.toLocaleString()}</div>
          <div class="coop-lv">Lv ${myLv} ${iWin?"&#x1F451;":""}</div>
        </div>
        <div class="coop-player ${!iWin?'coop-lead':''}">
          <div class="coop-name">${S.partner?.name||"Cliff"}</div>
          <div class="coop-xp">${pXp.toLocaleString()}</div>
          <div class="coop-lv">Lv ${pLv} ${!iWin?"&#x1F451;":""}</div>
        </div>
      </div>
      <div style="font-size:10px;color:var(--dim);margin-bottom:12px;text-align:center">
        ${iWin?"You have the crown. Make him work for it.":"Cliff is ahead &mdash; time to grind, mama."}
      </div>
      <div style="font-size:9px;color:var(--dim);margin-bottom:8px;letter-spacing:1px;text-transform:uppercase">How to sync</div>
      <div style="font-size:10px;color:var(--dim);margin-bottom:10px;line-height:1.6">Generate your code, send it to Cliff. He pastes it in his Co-Op tab. He sends you his code and you paste it below.</div>
      <textarea class="sync-box" id="sync-out" readonly placeholder="Click generate..."></textarea>
      <button class="sync-btn" onclick="genCode()">Generate My Code</button>
      <textarea class="sync-box" id="sync-in" placeholder="Paste Cliff&apos;s code here..."></textarea>
      <button class="sync-btn" onclick="importCode()">Sync Cliff&apos;s Data</button>
    </div>`;
    document.getElementById("app").innerHTML=html;return;
  }

  if(titles){
    html+=`<div class="card">
      <div class="card-title">Identity &mdash; ${activeTab.toUpperCase()}</div>
      <div style="font-size:18px;font-weight:bold;color:#f0e8f8">${getTitle(titles,catLv)}</div>
      <div class="bar"><div class="fill" style="width:${catPct}%"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--dim)">
        <span>${catXp%150}/150 XP to next</span><span>Lv ${catLv} &middot; ${catXp} total</span>
      </div>
    </div>`;
  }

  if(activeTab==="career"){
    if(dow===3||dow===4){
      html+=`<div style="margin:0 12px 8px;padding:9px 13px;background:rgba(96,165,250,0.08);border:1px solid rgba(96,165,250,0.25);border-radius:10px;font-size:11px;color:var(--blue)">Office day in Stockton &mdash; you got this.</div>`;
    } else if(dow===1||dow===2||dow===5){
      html+=`<div style="margin:0 12px 8px;padding:9px 13px;background:rgba(106,171,130,0.08);border:1px solid rgba(106,171,130,0.25);border-radius:10px;font-size:11px;color:var(--sage)">Work from home &mdash; Debbie has the boys.</div>`;
    }
  }

  const allQ=QUEST_DEFS[activeTab]||[];
  const visible=allQ.filter(q=>questVisible(q));

  if(activeTab==="wellness"){
    const wellQ=visible.filter(q=>!q.faith&&!q.penalty);
    const faithQ=visible.filter(q=>q.faith&&!q.penalty);
    const allPen=visible.filter(q=>q.penalty);
    const wUnlocked=wellQ.filter(q=>!questLocked(q));
    const wLocked=wellQ.filter(q=>questLocked(q));
    const fUnlocked=faithQ.filter(q=>!questLocked(q));

    if(wUnlocked.length||fUnlocked.length){
      html+=`<div class="section-label">${DAYS_FULL[dow]}&apos;s Wellness &amp; Faith</div>`;
      wUnlocked.forEach(q=>{html+=renderQuestRow(q,dk,false);});
      fUnlocked.forEach(q=>{html+=renderQuestRow(q,dk,true);});
    }
    if(wLocked.length){
      html+=`<div class="section-label" style="color:var(--gold)">Locked &mdash; level up to unlock</div>`;
      wLocked.forEach(q=>{
        html+=`<div class="quest locked"><div><div class="quest-text">${q.t}<span class="unlock-badge">Lv ${q.minLv}</span></div></div><div class="quest-xp" style="color:var(--dim)">+${q.xp}</div></div>`;
      });
    }
    if(allPen.length){
      html+=`<div class="section-label" style="color:var(--red)">${grace?"Grace Day &mdash; penalties waived":"Accountability"}</div>`;
      allPen.forEach(q=>{html+=renderQuestRow(q,dk,!!q.faith);});
    }
  } else {
    const unlocked=visible.filter(q=>!q.penalty&&!questLocked(q));
    const locked=visible.filter(q=>!q.penalty&&questLocked(q));
    const penalties=visible.filter(q=>q.penalty);
    if(unlocked.length){
      html+=`<div class="section-label">${DAYS_FULL[dow]}&apos;s Quests</div>`;
      unlocked.forEach(q=>{html+=renderQuestRow(q,dk,false);});
    }
    if(locked.length){
      html+=`<div class="section-label" style="color:var(--gold)">Locked &mdash; level up to unlock</div>`;
      locked.forEach(q=>{
        html+=`<div class="quest locked"><div><div class="quest-text">${q.t}<span class="unlock-badge">Lv ${q.minLv}</span></div></div><div class="quest-xp" style="color:var(--dim)">+${q.xp}</div></div>`;
      });
    }
    if(penalties.length){
      html+=`<div class="section-label" style="color:var(--red)">${grace?"Grace Day &mdash; penalties waived":"Accountability"}</div>`;
      penalties.forEach(q=>{html+=renderQuestRow(q,dk,false);});
    }
  }
  document.getElementById("app").innerHTML=html;
}

setTab("mother");
</script>
</body>
</html>
